openapi: 3.0.3
info:
  title: Pedidos
  version: 1.0.0
paths:
  /pedidos:
    post:
      summary: Cria um pedido, consultando o Cardápio para validar itens e calcular o total
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoPedido'
      responses:
        '201':
          description: Pedido confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '422':
          description: Item inexistente ou indisponível. Nenhum pedido é criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '503':
          description: O Cardápio não respondeu em até 2 segundos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /pedidos/{id}:
    get:
      summary: Consulta um pedido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '404':
          description: Pedido não existe
  /saude:
    get:
      summary: Verificação de saúde
      responses:
        '200':
          description: Serviço no ar
components:
  schemas:
    ItemPedido:
      type: object
      required: [itemId, quantidade]
      properties:
        itemId:
          type: integer
        quantidade:
          type: integer
          minimum: 1
    NovoPedido:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemPedido'
    Pedido:
      type: object
      required: [id, itens, totalCentavos, status]
      properties:
        id:
          type: integer
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedido'
        totalCentavos:
          type: integer
          description: Soma de preço x quantidade, em centavos
        status:
          type: string
          enum: [confirmado]
    Erro:
      type: object
      required: [mensagem]
      properties:
        mensagem:
          type: string